title: X-Laboratory
locale: en
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
timeout: 30s
disableKinds:
  - taxonomy
  - term

# Keep the public information architecture close to a documentation-style
# research site while leaving the source content organized by domain.
permalinks:
  page:
    people: /docs/home/members/:contentbasename/
    research: /docs/research/:contentbasename/
    publications: /docs/research/publications/:contentbasename/
    projects: /docs/research/projects/:contentbasename/
    news: /docs/home/news/:contentbasename/
    join: /docs/home/join-us/
    contact: /docs/home/contact/
    grants: /docs/research/grants/:contentbasename/
    opportunities: /docs/home/opportunities/:contentbasename/
    events: /docs/events/:contentbasename/
    resources: /docs/resources/:contentbasename/
    tools: /docs/tools/:contentbasename/
  section:
    people: /docs/home/members/
    research: /docs/research/
    publications: /docs/research/publications/
    projects: /docs/research/projects/
    news: /docs/home/news/
    grants: /docs/research/grants/
    opportunities: /docs/home/opportunities/
    events: /docs/events/
    resources: /docs/resources/
    tools: /docs/tools/

markup:
  goldmark:
    renderer:
      unsafe: false
