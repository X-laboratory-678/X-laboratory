<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Sign in to edit X-Laboratory website content in English or Chinese.">

  <meta property="og:title" content="Lab Content Editor · X-Laboratory">

  <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebPage","name":"Lab Content Editor · X-Laboratory","description":"Sign in to edit X-Laboratory website content in English or Chinese.","url":"https://x-laboratory-678.github.io/X-laboratory/editor/"}</script>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #182434; background: #f5f7fa; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    main { box-sizing: border-box; width: min(100%, 560px); padding: 36px; background: #fff; border: 1px solid #dce3ec; border-radius: 18px; box-shadow: 0 14px 50px #13284412; }
    h1 { font-size: 1.55rem; margin: 0 0 12px; } p { color: #556477; line-height: 1.7; }
    a, button { display: inline-block; border: 0; border-radius: 9px; padding: 12px 18px; font: inherit; font-weight: 650; color: white; background: #1769aa; text-decoration: none; cursor: pointer; }
    .muted { font-size: .9rem; } .secondary { color: #1769aa; background: #edf5fc; margin-left: 7px; }
  </style>
  <script src="./config.js"></script>
</head>
<body>
  <main>
    <h1>Lab Content Editor</h1>
    <p>Edit X-Laboratory website content in English or Chinese. Local editor accounts are separate from GitHub.</p>
    <div id="launch"></div>
    <p><a class="secondary" href="/X-laboratory/zh/editor/">中文</a></p>
    <p class="muted">The editor service is hosted by a Cloudflare Worker. Ask a site administrator if the service is not connected.</p>
  </main>
  <script>
    const mount = document.querySelector('#launch');
    const origin = (window.LAB_EDITOR_WORKER_URL || '').trim().replace(/\/$/, '');
    if (/^https:\/\/[a-z0-9.-]+$/.test(origin)) {
      const link = document.createElement('a');
      link.href = origin + '/editor/';
      link.textContent = 'Open content editor';
      mount.append(link);
    } else {
      const note = document.createElement('p');
      note.textContent = 'The editor service has not been connected yet.';
      mount.append(note);
    }
  </script>
</body>
</html>
