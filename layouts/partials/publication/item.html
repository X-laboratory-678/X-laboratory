<article class="publication-item">
  <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
  <p class="publication-item__authors">{{ partial "publication/authors.html" . }}</p>
  <p class="publication-item__meta">
    {{- with .Params.venue }}{{ . }} · {{ end }}{{ .Params.year }}
    <span aria-hidden="true"> · </span><span>{{ partial "publication/type-label.html" .Params.publicationType }}</span>
  </p>
  {{ partial "publication/links.html" . }}
</article>
