{{- $config := .config -}}
<header class="section__header" {{ with .page.File }}data-cms-file="{{ .Path }}"{{ end }}>
  {{- with $config.eyebrow }}<p class="section__eyebrow" data-cms-field="{{ $.field }}.eyebrow">{{ . }}</p>{{ end }}
  <h2 id="{{ .id }}" data-cms-field="{{ .field }}.title">{{ $config.title }}</h2>
  {{- with $config.description }}<p data-cms-field="{{ $.field }}.description">{{ . }}</p>{{ end }}
  {{- with site.GetPage $config.pageref }}
    <div class="section__action"><a class="text-link" href="{{ .RelPermalink }}">{{ $config.actionlabel }}</a></div>
  {{- end }}
</header>
