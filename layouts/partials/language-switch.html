{{- $translations := .AllTranslations -}}
{{- if not $translations -}}
  {{- $translations = slice . -}}
{{- end -}}
{{- range $translations -}}
  <li>
    <a href="{{ .RelPermalink }}" lang="{{ .Language.Locale }}" hreflang="{{ .Language.Locale }}"{{ if eq .Language.Lang $.Language.Lang }} aria-current="true"{{ end }}>
      {{ .Language.Label | default .Language.Lang }}
    </a>
  </li>
{{- end -}}
