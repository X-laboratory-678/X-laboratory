{{- partialCached "content/validate-site.html" site site.Language.Locale -}}
<!doctype html>
<html lang="{{ site.Language.Locale }}">
  {{ partial "head.html" . }}
  <body>
    <a class="skip-link" href="#main-content">{{ i18n "skip_to_content" }}</a>
    {{ partial "header.html" . }}
    <main id="main-content" class="site-main" tabindex="-1">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
  </body>
</html>
