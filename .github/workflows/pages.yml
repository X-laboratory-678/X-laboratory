name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read pinned Hugo version
        id: hugo
        shell: bash
        run: |
          hugo_version="$(tr -d '[:space:]' < .hugo-version)"
          if [[ -z "$hugo_version" ]]; then
            echo "The .hugo-version file is empty." >&2
            exit 1
          fi
          echo "version=$hugo_version" >> "$GITHUB_OUTPUT"

      - name: Install pinned Hugo Extended
        shell: bash
        env:
          HUGO_VERSION: ${{ steps.hugo.outputs.version }}
        run: |
          package="$RUNNER_TEMP/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          wget --quiet --output-document="$package" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg --install "$package"

      - name: Verify Hugo Extended
        shell: bash
        env:
          HUGO_VERSION: ${{ steps.hugo.outputs.version }}
        run: |
          version_output="$(hugo version)"
          echo "$version_output"
          [[ "$version_output" == *"v${HUGO_VERSION}"* ]]
          [[ "${version_output,,}" == *"extended"* ]]

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with the GitHub Pages base URL
        shell: bash
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          pages_base_url="${PAGES_BASE_URL%/}/"
          hugo \
            --gc \
            --minify \
            --cleanDestinationDir \
            --environment production \
            --panicOnWarning \
            --printPathWarnings \
            --baseURL "$pages_base_url"

      - name: Audit generated site
        run: python scripts/audit-site.py public

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
