# PILOT CONFIGURATION ONLY: do not point production editors at this file yet.
# Image fields are intentionally read-only; do not add a media source until bundle-relative uploads are proven safe.
# Each language file is edited as a separate entry. Create, rename, and delete stay disabled during the pilot.
settings:
  content: true
content:
  - name: people
    label: 人员
    type: collection
    path: content/people
    format: yaml-frontmatter
    subfolders: true
    exclude:
      - _index.en.md
      - _index.zh.md
    operations:
      create: false
      rename: false
      delete: false
    view:
      layout: tree
      primary: title
      fields:
        - title
        - id
        - translationKey
    fields:
      - name: title
        label: 中文/英文姓名
        required: true
        type: string
      - name: description
        label: 搜索摘要
        required: false
        type: text
      - name: id
        label: 稳定 ID
        required: true
        type: string
        readonly: true
        pattern:
          regex: ^[a-z0-9]+(-[a-z0-9]+)*$
          message: 请使用小写英文字母、数字和连字符
      - name: translationKey
        label: 翻译标识
        required: true
        description: 通常使用 people-稳定ID
        type: string
        readonly: true
      - name: role
        label: 角色
        required: true
        type: string
      - name: category
        label: 成员类别
        required: true
        type: select
        options:
          values:
            - pi
            - faculty
            - postdoc
            - phd
            - master
            - ra
            - undergraduate
            - visitor
            - alumni
      - name: cohort
        label: 年级/届别
        required: false
        type: string
      - name: status
        label: 状态
        required: true
        type: select
        options:
          values:
            - current
            - alumni
      - name: photo
        label: 头像文件
        required: false
        type: string
        readonly: true
        description: 试点阶段仅保留原有页面包图片路径，禁止改动。Pages CMS 的固定媒体目录无法保证按文章页面包上传；图片字段只读。
      - name: photoAlt
        label: 头像说明
        required: false
        type: string
      - name: email
        label: 公开邮箱
        required: false
        type: string
      - name: homepage
        label: 个人主页
        required: false
        type: string
      - name: github
        label: GitHub
        required: false
        type: string
      - name: aliases
        label: 旧网址别名
        required: false
        description: 保留已有别名；仅在需要保留旧网址时添加，不要随意删除。
        type: string
        list: true
      - name: googleScholar
        label: Google Scholar
        required: false
        type: string
      - name: orcid
        label: ORCID
        required: false
        type: string
      - name: researchInterests
        label: 研究兴趣
        required: false
        type: string
        list: true
      - name: joined
        label: 加入时间
        required: false
        type: string
      - name: left
        label: 离开时间
        required: false
        type: string
      - name: alumniNext
        label: 后续去向
        required: false
        type: string
      - name: weight
        label: 排序权重
        required: false
        type: number
      - name: body
        label: 页面正文
        required: false
        type: rich-text
        options:
          format: markdown
          media: false
      - name: draft
        label: Hugo 草稿
        type: boolean
        hidden: true
        readonly: true
        default: false
  - name: publications
    label: 论文
    type: collection
    path: content/publications
    format: yaml-frontmatter
    subfolders: true
    exclude:
      - _index.en.md
      - _index.zh.md
    operations:
      create: false
      rename: false
      delete: false
    view:
      layout: tree
      primary: title
      fields:
        - title
        - id
        - translationKey
    fields:
      - name: title
        label: 论文标题
        required: true
        type: string
      - name: description
        label: 搜索摘要
        required: false
        type: text
      - name: displayTitle
        label: 展示标题
        required: false
        type: string
      - name: id
        label: 稳定 ID
        required: true
        type: string
        readonly: true
        pattern:
          regex: ^[a-z0-9]+(-[a-z0-9]+)*$
          message: 请使用小写英文字母、数字和连字符
      - name: translationKey
        label: 翻译标识
        required: true
        description: 通常使用 publication-稳定ID
        type: string
        readonly: true
      - name: authors
        label: 作者（按论文原顺序）
        required: true
        type: object
        list:
          min: 1
        fields:
          - name: name
            label: 作者姓名
            required: true
            type: string
          - name: person
            label: 实验室成员 ID（如适用）
            required: false
            type: reference
            options:
              collection: people
              value: "{fields.id}"
              label: "{fields.title}"
      - name: labMembers
        label: 实验室成员
        required: false
        type: reference
        options:
          collection: people
          value: "{fields.id}"
          label: "{fields.title}"
          multiple: true
      - name: venue
        label: 期刊/会议
        required: false
        type: string
      - name: venueShort
        label: 期刊/会议简称
        required: false
        type: string
      - name: year
        label: 年份
        required: true
        type: number
      - name: publicationMonth
        label: 发表月份
        required: false
        type: number
      - name: date
        label: 发表日期
        required: false
        type: date
        default: ""
        options:
          time: false
      - name: publicationType
        label: 论文类型
        required: true
        type: select
        options:
          values:
            - conference
            - journal
            - preprint
            - workshop
            - book-chapter
            - thesis
            - other
      - name: publicationStatus
        label: 发表状态
        required: false
        type: select
        options:
          values:
            - preprint
            - submitted
            - accepted
            - in-press
            - published
      - name: doi
        label: DOI（不含 doi.org）
        required: false
        type: string
      - name: paperUrl
        label: 论文链接
        required: false
        type: string
      - name: pdf
        label: PDF 文件或链接
        required: false
        type: string
      - name: code
        label: 代码链接
        required: false
        type: string
      - name: projectPage
        label: 项目页 ID 或链接
        required: false
        type: string
      - name: dataset
        label: 数据集链接
        required: false
        type: string
      - name: video
        label: 视频链接
        required: false
        type: string
      - name: bibtex
        label: BibTeX 文件名
        required: false
        type: string
      - name: thumbnail
        label: 缩略图
        required: false
        type: string
        readonly: true
        description: 试点阶段仅保留原有页面包图片路径，禁止改动。Pages CMS 的固定媒体目录无法保证按文章页面包上传；图片字段只读。
      - name: selected
        label: 精选论文
        required: false
        type: boolean
        default: false
      - name: researchAreas
        label: 研究方向
        required: false
        type: reference
        options:
          collection: research
          value: "{fields.id}"
          label: "{fields.title}"
          multiple: true
      - name: tags
        label: 标签
        required: false
        type: string
        list: true
      - name: links
        label: 补充链接
        required: false
        type: object
        list: true
        fields:
          - name: label
            label: 链接名称
            required: true
            type: string
          - name: url
            label: URL
            required: true
            type: string
      - name: acceptanceRate
        label: 接收率
        required: false
        type: number
      - name: acceptanceRateSource
        label: 接收率来源
        required: false
        type: string
      - name: distinctions
        label: 荣誉/奖项
        required: false
        type: string
        list: true
      - name: metricsId
        label: 指标数据 ID
        required: false
        type: string
      - name: supplementary
        label: 补充资源 ID
        required: false
        type: reference
        options:
          collection: resources
          value: "{fields.id}"
          label: "{fields.title}"
          multiple: true
      - name: blog
        label: 相关博客 URL
        required: false
        type: string
      - name: aliases
        label: 旧网址别名
        required: false
        description: 保留已有别名；仅在需要保留旧网址时添加，不要随意删除。
        type: string
        list: true
      - name: body
        label: 摘要或论文说明
        required: false
        type: rich-text
        options:
          format: markdown
          media: false
      - name: draft
        label: Hugo 草稿
        type: boolean
        hidden: true
        readonly: true
        default: false
